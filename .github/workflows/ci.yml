name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Offline build from committed data/processed; a second build must reproduce every byte.
      - run: cargo run --release --locked -- build
      - run: |
          cp site/data/manifest.json target/manifest-baseline.json
          cargo run --release --locked -- build
          cmp target/manifest-baseline.json site/data/manifest.json
