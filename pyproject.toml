[project]
name = "prosperity-gap"
version = "0.1.0"
description = "Rent, renter income and jobs in 30 counties of CO, MA and WA, 2011-2024, with survey-error checks and release-aware forecasts."
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E731", "E741"]
