[project]
name = "prosperity-gap"
version = "0.1.0"
description = "Release-aware prediction of county renter cost burden from housing, employment and commuting data."
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E731", "E741"]
